services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: medibridge
      POSTGRES_USER: medibridge
      POSTGRES_PASSWORD: medibridge_local
    volumes:
      - medibridge-pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibridge -d medibridge"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  medibridge-pg:
