services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dodam
      POSTGRES_USER: dodam
      POSTGRES_PASSWORD: dodam_local
    volumes:
      - dodam-pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dodam -d dodam"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  dodam-pg:
