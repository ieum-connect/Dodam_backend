server:
  port: ${SERVER_PORT:8081}
  tomcat:
    max-swallow-size: 50MB
  servlet:
    session:
      timeout: 30d
      cookie:
        name: DODAM_SESSION
        http-only: true
        max-age: 2592000
        same-site: lax
        secure: ${JWT_COOKIE_SECURE:false}

spring:
  application:
    name: dodam
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/dodam}
    username: ${DB_USER:dodam}
    password: ${DB_PASSWORD:dodam_local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    # develop 병합으로 과거 시각의 일정 마이그레이션이 뒤늦게 들어와도
    # 이미 적용된 복지 마이그레이션을 되돌리지 않고 순서대로 적용한다.
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:unset}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO

dodam:
  push:
    enabled: ${PUSH_ENABLED:false}
    credentials: ${FIREBASE_CREDENTIALS:}
    web-api-key: ${FIREBASE_WEB_API_KEY:}
    project-id: ${FIREBASE_PROJECT_ID:}
    sender-id: ${FIREBASE_SENDER_ID:}
    app-id: ${FIREBASE_APP_ID:}
    vapid-key: ${FIREBASE_VAPID_KEY:}
  demo-login: ${DEMO_LOGIN:false}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4173}
  welfare:
    gov24:
      base-url: ${GOV24_WELFARE_BASE_URL:https://api.odcloud.kr/api}
      service-key: ${GOV24_WELFARE_SERVICE_KEY:}
      page-size: ${GOV24_WELFARE_PAGE_SIZE:100}
      connect-timeout: ${GOV24_WELFARE_CONNECT_TIMEOUT:2s}
      read-timeout: ${GOV24_WELFARE_READ_TIMEOUT:10s}
      sync-enabled: ${GOV24_WELFARE_SYNC_ENABLED:false}
  document:
    upload:
      max-bytes: 20971520
      max-pdf-pages: 30
      max-image-pixels: 40000000
      max-concurrent: 4
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./data/object-storage}
  ai:
    base-url: ${AI_BASE_URL:}
    internal-token: ${AI_INTERNAL_TOKEN:}
    parser-version: v1
    max-attempts: 3
    retry-backoff: 500ms
    connect-timeout: 2s
    read-timeout: 5s
    result-read-timeout: ${AI_RESULT_READ_TIMEOUT:330s}

jwt:
  secret: ${JWT_SECRET:}
  cookie-name: DODAM_TOKEN
  ttl-days: 30
  cookie-secure: ${JWT_COOKIE_SECURE:false}
